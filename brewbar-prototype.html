<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrewBar — 3D Prototype</title>
<style>
:root{--bg1:#f6f0e7;--bg2:#e1d5c4;--panel:#fffaf2;--ink:#2a2118;--mute:#7a6b5b;--line:#e4d8c7;--acc:#c4622d;--accink:#fff;--chip:#f2e9dc;--green:#1db954;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#25201b;--bg2:#12100e;--panel:#1b1714;--ink:#f3ebe0;--mute:#a39583;--line:#332c25;--acc:#e8814a;--accink:#1b1714;--chip:#2a241e;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#25201b;--bg2:#12100e;--panel:#1b1714;--ink:#f3ebe0;--mute:#a39583;--line:#332c25;--acc:#e8814a;--accink:#1b1714;--chip:#2a241e;color-scheme:dark}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg2)}
#app{display:flex;height:100%}
#stage{flex:1;position:relative;min-width:0;background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2))}
#c{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hint{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--mute)}
#reset{position:absolute;right:14px;top:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}
#panel{width:390px;max-width:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:18px 18px 28px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}h1 small{font-size:12px;font-weight:500;color:var(--mute);margin-left:6px}
.tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.tabs button,.seg button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.tabs button.on,.seg button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:9px 10px;cursor:pointer;display:flex;gap:9px;align-items:center}
.grid button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.grid b{display:block;font-size:13px;font-weight:600}.grid span{font-size:11px;color:var(--mute)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.row label{font-size:13px;color:var(--mute);min-width:64px}.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:5px 11px;font-size:12px}
#make{width:100%;margin-top:18px;padding:13px;border:0;border-radius:14px;background:var(--acc);color:var(--accink);font-size:15px;font-weight:600;cursor:pointer}
#make:disabled{opacity:.55;cursor:default}
.spot{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--chip)}
.spot header{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.spot header i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);margin-right:7px}
.spot.on header i{background:var(--green)}
.spot button.c{border:0;border-radius:16px;padding:6px 12px;font-size:12px;background:var(--green);color:#06210e;font-weight:600;cursor:pointer}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pl button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:5px 10px;font-size:12px;cursor:pointer}
.pl button.on{border-color:var(--green);color:var(--green)}
.np{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--mute)}
.np button{border:0;background:var(--ink);color:var(--panel);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:12px}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}.eq u{width:3px;background:var(--green);height:4px;border-radius:1px}
.eq.go u{animation:b .7s ease-in-out infinite alternate}.eq.go u:nth-child(2){animation-delay:.15s}.eq.go u:nth-child(3){animation-delay:.3s}.eq.go u:nth-child(4){animation-delay:.1s}
@keyframes b{to{height:16px}}
label.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-top:8px}
.note{font-size:11px;color:var(--mute);line-height:1.5;margin-top:14px}
@media (max-width:760px){#app{flex-direction:column}#stage{flex:none;height:46%}#panel{width:100%;flex:1;border-left:0;border-top:1px solid var(--line)}}
</style></head>
<body>
<div id="app">
<div id="stage"><canvas id="c"></canvas><div class="hint">Drag to rotate · scroll to zoom</div><button id="reset">Reset view</button></div>
<aside id="panel">
<h1>BrewBar<small>concept prototype</small></h1>
<div class="tabs" id="tabs"></div>
<div class="grid" id="drinks"></div>
<div class="row"><label>Size</label><div class="seg" id="size"></div></div>
<div class="row"><label id="exL"></label><div class="seg" id="extra"></div></div>
<div class="row"><label>Serve</label><div class="seg" id="ice"></div></div>
<div class="row" id="zrow"><label>Recipe</label><div class="seg" id="zero"></div></div>
<button id="make">Make my drink</button>
<div class="spot" id="spot"></div>
<p class="note">Concept only: the Spotify link and all dispensing are simulated. Cocktail mode is for 21+, and Zero-proof swaps in alcohol-free spirits with one tap.</p>
</aside></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CATS={
coffee:{l:"Coffee",verb:"Brewing",ex:["Milk",["Oat","Whole","None"]],items:[["Espresso",0x3a2013,0,"Double shot"],["Latte",0xb07d55,0,"Silky steamed milk"],["Cappuccino",0xc29566,0,"Thick foam"],["Flat White",0xbb8a5e,0,"Velvety micro-foam"],["Cold Brew",0x2b1a10,1,"Steeped 18h"],["Iced Latte",0xc9a27c,1,"Over ice"]]},
tea:{l:"Tea",verb:"Steeping",ex:["Milk",["Oat","Whole","None"]],items:[["Matcha",0x8fb55a,0,"Whisked ceremonial"],["Earl Grey",0xb5651d,0,"Bergamot black"],["Chai Latte",0xc9976a,0,"Spiced and creamy"],["Jasmine Green",0xd9d27a,0,"Light and floral"],["Iced Peach Tea",0xf3a46b,1,"Chilled and fruity"],["Hibiscus Cooler",0xc0305a,1,"Tart and bright"]]},
mocktails:{l:"Mocktails",verb:"Mixing",ex:["Sweet",["Low","Med","High"]],items:[["Virgin Mojito",0xcdeebb,1,"Mint and lime"],["Berry Fizz",0xd6457a,1,"Sparkling berries"],["Citrus Spritz",0xffcf4d,1,"Zesty and dry"],["Cucumber Cooler",0xbfe3c2,1,"Fresh and green"]]},
cocktails:{l:"Cocktails",verb:"Shaking",ex:["Strength",["Light","Classic","Strong"]],items:[["Espresso Martini",0x2a1810,1,"Coffee and vodka"],["Old Fashioned",0xc76a1e,1,"Bourbon, bitters"],["Margarita",0xd8e86a,1,"Tequila and lime"],["Aperol Spritz",0xff7a3d,1,"Bubbly bittersweet"],["Moscow Mule",0xe7d9a0,1,"Ginger and lime"]]}};
const PL=["Morning Brew","Quiet Hours","Poolside Pop","Cocktail Hour","Lo-fi Beats"],AUTO={coffee:0,tea:1,mocktails:2,cocktails:3};
const S={cat:"coffee",idx:0,size:1,extra:0,ice:false,zero:false,st:"idle",t:0};
const P={on:false,play:false,i:0,auto:true};
const cur=()=>{const a=CATS[S.cat].items[S.idx];return{n:a[0],c:a[1],ice:!!a[2],d:a[3]}};
const $=s=>document.querySelector(s),cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=t=>t*t*(3-2*t),hex=c=>"#"+c.toString(16).padStart(6,"0");

/* ---------- three.js scene ---------- */
const cv=$("#c"),stage=$("#stage");
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a5a4a,.95));
const key=new THREE.DirectionalLight(0xffffff,.85);key.position.set(3,5,5);scene.add(key);
const rig=new THREE.Group();scene.add(rig);
const mach=new THREE.Group();mach.position.x=.6;rig.add(mach);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.1},o||{}));
const add=(g,m,x,y,z,p)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);(p||mach).add(o);return o};
const Bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d),Cy=(a,b,h,s,o)=>new THREE.CylinderGeometry(a,b,h,s||40,1,!!o);
const dark=M(0x34343a,{metalness:.35,roughness:.4}),copper=M(0xc4622d,{metalness:.7,roughness:.35});
add(Cy(3.2,3.2,.05,64),M(0xd8cbb9,{roughness:.9}),-.6,-.03,.2); // floor disc
add(Bx(2.3,.35,1.7),M(0x2b2b2e),0,.175,0);
add(Bx(1.3,.35,1.2),M(0x2b2b2e),-1.8,.175,.1);              // mug dock shelf
add(Bx(1.3,.03,.03),copper,-1.8,.36,.72);
add(Bx(2.2,3.2,.35),dark,0,1.6,-.65);
add(Bx(2.2,1.75,1.6),dark,0,2.375,0);
add(Bx(2.22,.06,1.62),copper,0,1.53,0);
add(Bx(1.7,.98,.04),M(0x08080a),0,2.65,.8);
const sc=document.createElement("canvas");sc.width=512;sc.height=288;
const tex=new THREE.CanvasTexture(sc);
add(new THREE.PlaneGeometry(1.6,.9),new THREE.MeshBasicMaterial({map:tex}),0,2.65,.825);
const ledMat=new THREE.MeshBasicMaterial({color:0xe8814a});add(Bx(1.7,.05,.03),ledMat,0,2.05,.81);
add(Cy(.22,.28,.16,32),M(0x111114,{metalness:.6}),0,1.42,.3);add(Cy(.04,.06,.12,20),M(0x999999,{metalness:.8}),0,1.3,.3);
add(Bx(.95,.05,.85),M(0x1a1a1d,{metalness:.5}),0,.375,.3);
add(Cy(.42,.42,.03,48),M(0xb85a2b,{roughness:.8}),0,.415,.3);
const ringMat=new THREE.MeshBasicMaterial({color:0x553322});
const ring=add(new THREE.TorusGeometry(.43,.012,8,64),ringMat,0,.435,.3);ring.rotation.x=Math.PI/2;
// top: bean hopper + spirits rack
add(Cy(.34,.4,.55,40),M(0x4a2c1a,{transparent:true,opacity:.75}),-.6,3.52,-.2);add(Cy(.36,.36,.07,40),M(0x111114),-.6,3.83,-.2);
add(Bx(1.1,.04,.45),copper,.5,3.27,-.2);
const bottles=[0xc9801f,0x9ad0e0,0x4f8f4f,0xc2362f].map((c,i)=>{const m=M(c,{transparent:true,opacity:.9,roughness:.2});
 add(Cy(.1,.1,.34,24),m,.15+i*.27,3.46,-.2);add(Cy(.035,.05,.2,16),m,.15+i*.27,3.73,-.2);return m});
// mug dock: decor mugs, glass, coaster stack
function buildMug(){const g=new THREE.Group(),w=M(0xf6efe4,{roughness:.35,side:THREE.DoubleSide});
 const b=new THREE.Mesh(Cy(.27,.23,.5,40,1),w);b.geometry=Cy(.27,.23,.5,40,true);b.position.y=.25;g.add(b);
 const f=new THREE.Mesh(Cy(.23,.23,.03,40),w);f.position.y=.015;g.add(f);
 const h=new THREE.Mesh(new THREE.TorusGeometry(.14,.035,12,24,Math.PI),w);h.rotation.z=-Math.PI/2;h.position.set(.27,.27,0);g.add(h);return g}
function buildGlass(){const g=new THREE.Group();
 const b=new THREE.Mesh(Cy(.27,.22,.8,40,true),M(0xdff3ff,{transparent:true,opacity:.22,side:THREE.DoubleSide,roughness:.05}));b.position.y=.4;g.add(b);
 const f=new THREE.Mesh(Cy(.22,.22,.05,40),M(0xdff3ff,{transparent:true,opacity:.5}));f.position.y=.025;g.add(f);return g}
[[-1.4,0],[-1.8,0]].forEach(p=>{const m=buildMug();m.position.set(p[0],.35,-.15);mach.add(m)});
const dg=buildGlass();dg.position.set(-2.15,.35,-.15);mach.add(dg);
for(let i=0;i<4;i++)add(Cy(.3,.3,.03,40),M(0xb85a2b,{roughness:.8}),-1.1+0*i,.365+i*.032,.35);
// active vessels
const mugG=buildMug(),glassG=buildGlass();mach.add(mugG);mach.add(glassG);
const lqGeo=(a,b)=>{const g=Cy(a,b,1,32);g.translate(0,.5,0);return g};
const mugL=new THREE.Mesh(lqGeo(.25,.215),M(0x3a2013,{roughness:.3}));mugL.position.y=.03;mugG.add(mugL);
const glassL=new THREE.Mesh(lqGeo(.255,.215),M(0x3a2013,{roughness:.2,transparent:true,opacity:.92}));glassL.position.y=.04;glassG.add(glassL);
const F=[[-.08,.07,.04],[.08,.08,-.05],[0,.2,.09],[-.07,.22,-.07],[.09,.3,.03],[-.02,.36,-.01]];
const cubes=F.map(f=>{const c=new THREE.Mesh(Bx(.12,.12,.12),M(0xffffff,{transparent:true,opacity:.7,roughness:.1}));c.rotation.set(f[0]*5,f[1]*9,f[2]*4);glassG.add(c);return c});
const stream=add(Cy(.014,.014,1,10),new THREE.MeshBasicMaterial({color:0x3a2013}),0,1,.3);
const puffs=[];for(let k=0;k<14;k++){const p=add(new THREE.SphereGeometry(.05,10,10),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.3}),0,1,.3);puffs.push(p)}

/* ---------- touchscreen ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill()}
function screen(time){const g=sc.getContext("2d"),W=512,H=288,d=cur(),mk=S.st!=="idle";
 g.fillStyle="#0e0e12";g.fillRect(0,0,W,H);g.textBaseline="middle";g.textAlign="left";
 g.fillStyle="#e8814a";g.font="700 20px system-ui,sans-serif";g.fillText("BrewBar",20,24);
 g.fillStyle=P.on?"#1db954":"#555";g.beginPath();g.arc(W-24,24,6,0,7);g.fill();
 g.fillStyle="#999";g.font="14px system-ui,sans-serif";g.textAlign="right";g.fillText(P.on?"Spotify":"Spotify off",W-38,24);g.textAlign="left";
 let x=20;Object.keys(CATS).forEach(k=>{g.font="600 16px system-ui,sans-serif";const w=g.measureText(CATS[k].l).width+22;
  g.fillStyle=k===S.cat?"#e8814a":"#24242b";rr(g,x,46,w,28,14);g.fillStyle=k===S.cat?"#fff":"#aaa";g.fillText(CATS[k].l,x+11,61);x+=w+8});
 g.fillStyle="#fff";g.font="700 38px system-ui,sans-serif";g.fillText(d.n,20,122);
 g.fillStyle="#aaa";g.font="15px system-ui,sans-serif";
 const sz=["Small","Medium","Large"][S.size],ex=CATS[S.cat].ex;
 g.fillText(sz+" · "+ex[0]+": "+ex[1][S.extra]+" · "+(S.ice?"On ice":"Hot")+(S.cat==="cocktails"?(S.zero?" · 0.0% ABV":" · 21+"):""),20,152);
 g.fillStyle=hex(d.c);g.beginPath();g.arc(W-62,118,30,0,7);g.fill();
 const pct=S.st==="idle"?0:S.t;g.fillStyle="#2a2a32";rr(g,20,184,W-40,10,5);g.fillStyle="#e8814a";if(pct>0)rr(g,20,184,Math.max(10,(W-40)*pct),10,5);
 g.fillStyle="#ccc";g.font="600 16px system-ui,sans-serif";
 g.fillText(S.st==="idle"?"Ready. Tap Make on the panel.":S.st==="making"?CATS[S.cat].verb+"… "+Math.round(pct*100)+"%":"Ready. Enjoy!",20,214);
 g.fillStyle="#1db954";for(let i=0;i<6;i++){const h=P.on&&P.play?6+14*Math.abs(Math.sin(time*5+i*1.3)):4;g.fillRect(20+i*8,266-h,5,h)}
 g.fillStyle="#999";g.font="14px system-ui,sans-serif";g.fillText(P.on&&P.play?"Now playing · "+PL[P.i]:"Music paused",80,258);
 tex.needsUpdate=true}

/* ---------- animation loop ---------- */
let rotY=0,tilt=.08,zoom=1,auto=true,time=0,last=performance.now();
function setCam(){const a=camera.aspect,d=9.6*Math.max(1,1.2/a)*zoom;camera.position.set(0,2.6+(d-9.6)*.04,d);camera.lookAt(0,1.7,0)}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();setCam()}
new ResizeObserver(resize).observe(stage);
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
 if(S.st==="making"){S.t+=dt/6;if(S.t>=1){S.t=1;S.st="ready";render()}}
 const d=cur(),mk=S.st!=="idle",t=mk?S.t:1,lvl=[.6,.8,1][S.size];
 mugG.visible=!S.ice;glassG.visible=S.ice;
 const V=S.ice?glassG:mugG,L=S.ice?glassL:mugL;
 const slide=mk?ease(cl(t/.2)):1;
 V.position.set(-1.75*(1-slide),.35+.08*slide,.3);
 const fill=mk?ease(cl((t-.3)/.55)):0,sy=(S.ice?.68:.42)*lvl*fill;
 L.material.color.setHex(d.c);L.scale.y=Math.max(.001,sy);L.visible=sy>.004;
 const top=V.position.y+L.position.y+sy;
 const pour=mk&&t>.3&&t<.85;stream.visible=pour;
 if(pour){const h=1.24-top;stream.material.color.setHex(d.c);stream.scale.y=h;stream.position.set(0,top+h/2,.3)}
 cubes.forEach((c,i)=>{const ct=S.ice&&mk?cl((t-.2-i*.02)/.12):0;c.visible=ct>0;c.position.set(F[i][0],.95+(F[i][1]+lvl*.3*fill-.95)*ease(ct),F[i][2])});
 const hot=!S.ice&&(S.cat==="coffee"||S.cat==="tea")&&mk&&t>.5;
 puffs.forEach((p,k)=>{p.visible=hot;if(!hot)return;const ph=(time*.35+k/14)%1;p.position.set(Math.sin(k*2.1+time)*.09,.43+.6+ph*.55,.3+Math.cos(k*1.7+time)*.05);p.material.opacity=.32*(1-ph)});
 bottles.forEach((m,i)=>{const on=S.cat==="cocktails"&&!S.zero&&S.st==="making"&&S.t>.3&&S.t<.7&&(i===S.idx%4||i===(S.idx+1)%4);m.emissive.setHex(on?m.color.getHex():0);m.emissiveIntensity=on?.6+.3*Math.sin(time*12):0});
 const beat=P.on&&P.play?.5+.5*Math.sin(time*6):.35;
 ledMat.color.setHex(0xe8814a).multiplyScalar(.35+.65*beat);
 ringMat.color.setHex(mk?0xffb27a:0x553322).multiplyScalar(mk?.7+.3*Math.sin(time*3):1);
 if(auto)rotY=Math.sin(time*.4)*.35;
 rig.rotation.y=rotY;rig.rotation.x=tilt;
 screen(time);renderer.render(scene,camera)}
let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);auto=false});
cv.addEventListener("pointermove",e=>{if(!drag)return;rotY=cl(rotY+(e.clientX-drag.x)*.008,-1.4,1.4);tilt=cl(tilt+(e.clientY-drag.y)*.004,-.1,.35);drag={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointerup",()=>drag=null);
cv.addEventListener("wheel",e=>{e.preventDefault();zoom=cl(zoom*(1+e.deltaY*.001),.6,1.4);setCam()},{passive:false});
$("#reset").onclick=()=>{zoom=1;tilt=.08;auto=true;setCam()};

/* ---------- panel UI ---------- */
function seg(el,opts,get,set){el.innerHTML=opts.map((o,i)=>`<button class="${get()===i?"on":""}" data-i="${i}">${o}</button>`).join("");
 el.onclick=e=>{const b=e.target.closest("button");if(!b)return;set(+b.dataset.i);render()}}
function render(){
 $("#tabs").innerHTML=Object.keys(CATS).map(k=>`<button class="${k===S.cat?"on":""}" data-k="${k}">${CATS[k].l}</button>`).join("");
 $("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.cat=b.dataset.k;S.idx=0;S.extra=1;S.zero=false;S.ice=cur().ice;S.st="idle";if(P.on&&P.auto)P.i=AUTO[S.cat];render()};
 $("#drinks").innerHTML=CATS[S.cat].items.map((a,i)=>`<button class="${i===S.idx?"on":""}" data-i="${i}"><i class="dot" style="background:${hex(a[1])}"></i><div><b>${a[0]}</b><span>${a[3]}</span></div></button>`).join("");
 $("#drinks").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.idx=+b.dataset.i;S.ice=cur().ice;S.st="idle";render()};
 seg($("#size"),["Small","Medium","Large"],()=>S.size,i=>{S.size=i;S.st="idle"});
 $("#exL").textContent=CATS[S.cat].ex[0];
 seg($("#extra"),CATS[S.cat].ex[1],()=>S.extra,i=>S.extra=i);
 const hotCat=S.cat==="coffee"||S.cat==="tea";
 seg($("#ice"),hotCat?["Hot","Iced"]:["No ice","On ice"],()=>S.ice?1:0,i=>{S.ice=!!i;S.st="idle"});
